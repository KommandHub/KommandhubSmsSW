name: Bug report
description: Report a problem with the plugin
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

        ⚠️ **Do not report security vulnerabilities here.** Follow
        [SECURITY.md](../blob/main/SECURITY.md) to report them privately.

        ⚠️ **Never paste real API keys, secret hashes, or live customer data.**
        Redact anything sensitive.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: I have removed all secrets/credentials from this report.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
      placeholder: |
        1. Go to '...'
        2. Configure '...'
        3. Pay with '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include relevant log excerpts from `var/log/` (redacted).
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: e.g. 0.9.0-beta.1
    validations:
      required: true
  - type: input
    id: shopware-version
    attributes:
      label: Shopware version
      placeholder: e.g. 6.7.8.0
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.3
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Live
        - Sandbox / Test
    validations:
      required: true
